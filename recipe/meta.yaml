{% set name = "asyncpg" %}
{% set version = "0.29.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d1c49e1f44fffafd9a55e1a9b101590859d881d639ea2922516f5d9c512d354e

build:
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation .
  skip: True  # [py<38]

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    # setup.py specifies the exact Cython version. This is not really needed
    # without this setuptools will try to download Cython
    - cython
  run:
    - python
    - async-timeout >=4.0.3  # [py<312]

test:
  imports:
    - asyncpg
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/MagicStack/asyncpg
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: A fast PostgreSQL Database Client Library for Python/asyncio.
  description: |
    asyncpg is a database interface library designed specifically for
    PostgreSQL and Python/asyncio. asyncpg is an efficient, clean
    implementation of PostgreSQL server binary protocol for use with Python's
    asyncio framework.
  doc_url: https://magicstack.github.io/asyncpg
  dev_url: https://github.com/MagicStack/asyncpg

extra:
  recipe-maintainers:
    - nehaljwani
    - xhochy
